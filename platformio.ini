; Waveshare ESP32-S3-Touch-AMOLED-1.8
; ESP32-S3R8 (8MB octal PSRAM) + 16MB Flash, SH8601 QSPI AMOLED 368x448

[env:esp32-s3-amoled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=8192
    -std=gnu++17

build_unflags =
    -std=gnu++11

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    https://github.com/pschatzmann/arduino-libhelix.git
